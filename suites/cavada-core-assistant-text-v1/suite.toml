rotation_due = "2027-02-05"
contamination_status = "All active public and practice cases are repository-visible and assumed contaminated after release"
canary_strategy = "Private canaries will be generated only after restricted storage is provisioned"
known_leaks = "All active 0.4.0 cases are repository-visible; inactive 0.1.0 through 0.3.0 datasets remain public for reproducibility"
representativeness = "Balanced development coverage only; not representative, calibrated, independently reviewed, or a private holdout"
transfer_restrictions = "No personal data; future restricted splits must remain in approved regions and stores"
near_duplicate_threshold = 0.92
minimum_category_cases = 80
maximum_category_share = 0.15

