[project]
name = "cavadalabs-evals"
version = "0.4.0"
description = "CavadaLabs protocol for reproducible, auditable AI evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "CavadaLabs"}]
keywords = ["ai", "evaluation", "benchmark", "llm", "safety", "performance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cavadalabs/cavadalabs-evals"
Documentation = "https://github.com/cavadalabs/cavadalabs-evals#readme"
Repository = "https://github.com/cavadalabs/cavadalabs-evals.git"
Issues = "https://github.com/cavadalabs/cavadalabs-evals/issues"

[project.scripts]
cavada-eval = "cavada_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12,<1", "mypy>=1.15,<2"]
deepeval = ["deepeval>=3,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cavada_eval"]

[tool.hatch.build.targets.wheel.force-include]
"PROTOCOL.md" = "cavada_eval/PROTOCOL.md"
"suites/demo-v1" = "cavada_eval/demo_suite"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:deepeval"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
