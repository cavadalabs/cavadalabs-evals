[project]
name = "cavadalabs-evals"
version = "0.1.0"
description = "CavadaLabs protocol for reproducible, auditable AI evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
cavada-eval = "cavada_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]
deepeval = ["deepeval>=3,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cavada_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:deepeval"
