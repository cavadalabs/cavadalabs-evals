[project]
name = "cavadalabs-evals"
version = "0.3.0"
description = "CavadaLabs protocol for reproducible, auditable AI evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "CavadaLabs"}]
keywords = ["ai", "evaluation", "benchmark", "llm", "safety", "performance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cavadalabs/cavadalabs-evals"
Documentation = "https://github.com/cavadalabs/cavadalabs-evals#readme"
Repository = "https://github.com/cavadalabs/cavadalabs-evals.git"
Issues = "https://github.com/cavadalabs/cavadalabs-evals/issues"

[project.scripts]
cavada-eval = "cavada_eval.cli:main"

[dependency-groups]
dev = ["jsonschema>=4.23,<5", "pytest>=8.3", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cavada_eval"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "cavada_eval/_resources/schemas"
"performance" = "cavada_eval/_resources/performance"
"program" = "cavada_eval/_resources/program"
"standards" = "cavada_eval/_resources/standards"
"suites/cavada-core-assistant-text-v1" = "cavada_eval/_resources/suites/cavada-core-assistant-text-v1"
"suites/security-privacy-smoke-v1" = "cavada_eval/_resources/suites/security-privacy-smoke-v1"
"suites/template" = "cavada_eval/_resources/suites/template"
"PROTOCOL.md" = "cavada_eval/_resources/PROTOCOL.md"
"PERFORMANCE_PROTOCOL.md" = "cavada_eval/_resources/PERFORMANCE_PROTOCOL.md"
"PERFORMANCE_PROTOCOL_V1_0.md" = "cavada_eval/_resources/PERFORMANCE_PROTOCOL_V1_0.md"
"PERFORMANCE_PROTOCOL_V2.md" = "cavada_eval/_resources/PERFORMANCE_PROTOCOL_V2.md"
"IMPLEMENTATION_CHECKLIST.md" = "cavada_eval/_resources/IMPLEMENTATION_CHECKLIST.md"
"OFFICIAL_EVALUATION_PROGRAM.md" = "cavada_eval/_resources/OFFICIAL_EVALUATION_PROGRAM.md"
"SECURITY.md" = "cavada_eval/_resources/SECURITY.md"
"docs/COMPLIANCE.md" = "cavada_eval/_resources/docs/COMPLIANCE.md"
"docs/THREAT_MODEL.md" = "cavada_eval/_resources/docs/THREAT_MODEL.md"
".github/workflows/ci.yml" = "cavada_eval/_resources/.github/workflows/ci.yml"

[tool.hatch.build.targets.sdist]
exclude = ["/.codex-internal/**", "/dist/**", "/runs/**", "/tmp/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
