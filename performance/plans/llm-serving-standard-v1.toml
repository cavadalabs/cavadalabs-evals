plan_version = "1.0.0"
revision = "1.0.0"
name = "llm-serving-standard-v1"
description = "Broad candidate LLM serving campaign across context, output, concurrency and offered load; not an official reference campaign."
profile = "llm-serving-v1"
data_classification = "synthetic"

[workload]
id = "llm-serving-synthetic-v1"
revision = "1.0.0"
path = "../workloads/llm-serving-synthetic-v1.jsonl"
sha256 = "5e3f2782a0ea26c3a697c4bbf43adef356514f78584689c0a71e2e3a98f78562"
mode = "iso-prompt"
input_token_tolerance_fraction = 0.05

[generation]
stream = true
temperature = 0
request_defaults = { top_p = 1 }

[execution]
repetitions = 1
warmup_requests = 2
measured_requests = 10
open_loop_duration_seconds = 30
bootstrap_samples = 2000
seed = 4345
randomize_cells = true
cooldown_seconds = 2
max_in_flight = 64

[limits]
timeout_seconds = 900
max_requests = 1000
max_total_tokens = 300000000
max_campaign_seconds = 86400
max_context_tokens = 131072
max_output_tokens = 2048

[slo]
ttft_p95_ms = 30000
e2e_p99_ms = 300000
goodput_ttft_ms = 30000
goodput_e2e_ms = 300000
maximum_error_rate = 0.01
minimum_output_tokens_fraction = 0.5

[[scenarios]]
id = "standard-context-output"
arrival = "closed-loop"
context_tokens = [128, 2048, 8192, 32768, 131072]
output_tokens = [128, 512, 2048]
concurrency = [1]

[[scenarios]]
id = "standard-throughput"
arrival = "closed-loop"
context_tokens = [2048, 8192, 32768]
output_tokens = [512]
concurrency = [1, 2, 4, 8]
warmup_requests = 5
measured_requests = 25

[[scenarios]]
id = "standard-long-context"
arrival = "closed-loop"
context_tokens = [131072]
output_tokens = [2048]
concurrency = [1, 2]
warmup_requests = 1
measured_requests = 5

[[scenarios]]
id = "standard-open-loop"
arrival = "open-loop"
context_tokens = [2048]
output_tokens = [512]
request_rates = [0.25, 0.5, 1, 2, 5]
warmup_requests = 2
duration_seconds = 30
