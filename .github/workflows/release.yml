name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --frozen
      - name: Verify tag matches package version
        run: uv run python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version"
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/check_secrets.py
      - run: uv run python scripts/generate_sbom.py --output dist/sbom.cdx.json
      - run: uv build
      - name: Verify the wheel demo outside the checkout
        run: |
          cd "$(mktemp -d)"
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print | sort | tail -1)
          uvx --from "${wheel}[reports]" cavada-eval demo
      - run: uv run python scripts/generate_provenance.py
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json
      - name: Create immutable release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/sbom.cdx.json dist/build-provenance.json --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
