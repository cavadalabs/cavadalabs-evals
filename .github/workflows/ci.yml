name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "true"
  DEEPEVAL_DISABLE_DOTENV: "1"
  DEEPEVAL_DISABLE_LEGACY_KEYFILE: "1"
  DEEPEVAL_UPDATE_WARNING_OPT_IN: "false"
  ERROR_REPORTING: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/check_secrets.py
      - run: uvx pip-audit==2.10.1 --strict --progress-spinner off
      - run: uv run cavada-eval doctor
      - run: uv run cavada-eval program
      - run: uv run cavada-eval presets
      - run: uv run cavada-eval perf validate --preset quick
      - run: uv run cavada-eval perf validate --preset standard
      - run: uv run cavada-eval perf validate performance/plans/llm-serving-v1.toml
      - run: uv run cavada-eval demo
      - run: uv run cavada-eval validate suites/demo-v1
      - run: uv run cavada-eval validate suites/template
      - run: uv run cavada-eval validate suites/security-privacy-smoke-v1
      - run: uv run python scripts/generate_sbom.py --output dist/sbom.cdx.json
      - run: uv build
      - name: Verify the wheel demo outside the checkout
        run: |
          cd "$(mktemp -d)"
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print | sort | tail -1)
          uvx --from "${wheel}[reports]" cavada-eval demo
      - run: uv run python scripts/generate_provenance.py
      - run: uv run python -m compileall -q src scripts

  deepeval-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --frozen --group deepeval
      - run: uv run --group deepeval python -c "from cavada_eval.deepeval_adapter import secure_import; secure_import()"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
