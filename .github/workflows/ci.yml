name: ci

on:
  pull_request:
  push:
    branches: [main, "next/**"]

permissions:
  contents: read
  attestations: read

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "true"
  DEEPEVAL_DISABLE_DOTENV: "1"
  DEEPEVAL_DISABLE_LEGACY_KEYFILE: "1"
  DEEPEVAL_UPDATE_WARNING_OPT_IN: "false"
  ERROR_REPORTING: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/check_secrets.py
      - run: uv run python scripts/check_released_assets.py
      - run: uv run python scripts/check_release.py
      - name: Validate append-only results registries
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$REGISTRY_BASE_SHA" && ! "$REGISTRY_BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$REGISTRY_BASE_SHA:results/registry.json"; then
            git show "$REGISTRY_BASE_SHA:results/registry.json" > "$RUNNER_TEMP/previous-registry-v1.json"
            uv run python scripts/validate_results_registry.py results/registry.json --previous "$RUNNER_TEMP/previous-registry-v1.json"
          else
            uv run python scripts/validate_results_registry.py results/registry.json --initial-empty
          fi
          if [[ -n "$REGISTRY_BASE_SHA" && ! "$REGISTRY_BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$REGISTRY_BASE_SHA:results/registry-v2.json"; then
            git show "$REGISTRY_BASE_SHA:results/registry-v2.json" > "$RUNNER_TEMP/previous-registry-v2.json"
            uv run python scripts/validate_results_registry.py results/registry-v2.json --previous "$RUNNER_TEMP/previous-registry-v2.json" --verify-attestations-online
          else
            uv run python scripts/validate_results_registry.py results/registry-v2.json --initial-empty --verify-attestations-online
          fi
      - run: uvx pip-audit==2.10.1 --strict --progress-spinner off
      - run: uv run cavada-eval doctor
      - run: uv run cavada-eval program
      - run: uv run cavada-eval presets
      - run: uv run cavada-eval perf validate --preset quick
      - run: uv run cavada-eval perf validate --preset standard
      - run: uv run cavada-eval perf validate performance/plans/llm-serving-v1.toml
      - run: uv run cavada-eval demo
      - run: uv run cavada-eval validate suites/demo-v1
      - run: uv run cavada-eval validate suites/template
      - run: uv run cavada-eval validate suites/security-privacy-smoke-v1
      - run: uv run python scripts/generate_sbom.py --output dist/sbom.cdx.json
      - run: uv build
      - name: Verify the wheel outside the checkout
        run: |
          cd "$(mktemp -d)"
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print | sort | tail -1)
          uvx --from "${wheel}[reports]" cavada-eval demo
          uvx --from "$wheel" cavada-eval doctor
          uvx --from "$wheel" cavada-eval program
          uvx --from "$wheel" cavada-eval perf validate --preset reference
      - run: uv run python scripts/generate_provenance.py
      - run: uv run python -m compileall -q src scripts

  deepeval-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --frozen --group deepeval
      - run: uv run --group deepeval python -c "from cavada_eval.deepeval_adapter import secure_import; secure_import()"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
